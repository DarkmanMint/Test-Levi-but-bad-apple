name: Build LeviPack
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install NDK and CMake
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Configure and build
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Package .levipack
        run: |
          mkdir -p dist/BadAppleOverlay/config
          cp manifest.json dist/BadAppleOverlay/
          cp config/config.json config/config.schema.json dist/BadAppleOverlay/config/
          cp build/libbad_apple_overlay.so dist/BadAppleOverlay/
          cd dist
          zip -r BadAppleOverlay.levipack BadAppleOverlay
      - uses: actions/upload-artifact@v4
        with:
          name: BadAppleOverlay-levipack
          path: dist/BadAppleOverlay.levipack
